name: First Workflow
on: [ push, workflow_dispatch ]
jobs:
  first-job:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v3
      - name: Install dependencies
        run: npm ci
      - name: runLint
        run: npm run lint
      - name: test
        run: npm run test
      - name: Deploy
        run: echo "deploy"
       
